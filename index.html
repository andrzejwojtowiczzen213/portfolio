<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
      body {
        margin: 64px auto 0;
        position: relative;
        max-width: 1440px;
        padding: 0 64px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 4em;
        margin: 0;
        font-weight: normal;
      }

      h1 strong {
        font-weight: bold;
      }
      h2 {
        font-size: 3em;
        font-weight: normal;
        margin: 20px 0;
      }
      a,
      a:visited,
      a:active {
        color: blue;
      }
      a:hover {
        color: #00008b;
      }
      .h2-item a::after {
        content: '';
        margin-left: 12px;
      }
      .h2-item:hover a::after,
      .h2-item.active a::after {
        content: '→';
        display: inline-block;
        text-decoration: none;
        font-size: 0.8em;
      }
      .h2-item:hover a,
      .h2-item.active a {
        font-weight: bold;
      }
      .page-layout {
        display: flex;
        gap: 64px;
        align-items: center;
      }
      .nav-list {
        flex-shrink: 0;
      }
      .info-panel {
        flex: 1;
        min-height: 400px;
        padding-top: 0;
      }
      .info-panel .hover-text {
        margin-top: 20px;
        max-width: 480px;
        display: none;
        font-size: 2rem;
        line-height: 1.5;
        color: #000;
        font-weight: normal;
      }
      .h2-item {
        position: relative;
      }


      .header {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-bottom: 48px;
      }
      .portrait {
        width: 200px;
        height: 200px;
        flex-shrink: 0;
      }
    </style>

    <script>
      document.querySelectorAll('.h2-item[data-target]').forEach(function(item) {
        item.addEventListener('mouseenter', function() {
          if (!item.classList.contains('active')) {
            document.getElementById(item.dataset.target).style.display = 'block';
          }
        });
        item.addEventListener('mouseleave', function() {
          if (!item.classList.contains('active')) {
            document.getElementById(item.dataset.target).style.display = 'none';
          }
        });
        item.querySelector('a').addEventListener('click', function(e) {
          e.preventDefault();
          var id = item.dataset.target;
          var panel = document.getElementById(id);
          var isActive = item.classList.contains('active');
          // close all
          document.querySelectorAll('.h2-item').forEach(function(i) {
            i.classList.remove('active');
          });
          document.querySelectorAll('.hover-text').forEach(function(p) {
            p.style.display = 'none';
          });
          if (!isActive) {
            item.classList.add('active');
            panel.style.display = 'block';
          }
        });
      });
    </script>
